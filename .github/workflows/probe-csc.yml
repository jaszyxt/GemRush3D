name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mono-devel
          echo "--- which mono ---"; which mono
          echo "--- mono --version ---"; mono --version | head -2
          echo "--- find csc/mcs ---"; find /usr/lib/mono -maxdepth 3 -name "csc*" -o -maxdepth 3 -name "mcs*" 2>/dev/null | head -10
          echo "--- pkg-config mono dir ---"; ls /usr/lib/mono/ 2>/dev/null | head
          echo "--- mscorlib location ---"; find /usr/lib/mono -name mscorlib.dll 2>/dev/null | head -3
