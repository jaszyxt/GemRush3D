name: syntax-check

on: [push, pull_request]

jobs:
  dotnet-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile game scripts against Unity stubs (no Unity needed)
        run: dotnet build tools/Check.csproj
      - name: Version drift check (VERSION vs docs)
        run: sh tools/check-version.sh
      - name: Motion consistency (informational inventory)
        # Reports the motion constants outside the shared helpers. Fails
        # ONLY on a genuinely duplicated spring (the historical Pip/Flower
        # copy-paste); everything else is printed for a reviewer.
        run: sh tools/check-motion.sh
      - name: Protected user directives (docs/User-Directives.md)
        # Fails when a rule the USER set has been changed without their
        # explicit instruction (e.g. haptics creeping back onto the jump).
        # If this fails, do NOT weaken the guard — see the file's header.
        run: sh tools/check-directives.sh
      - name: Format check (see .editorconfig)
        # Fails if any file would be reformatted. Whitespace and brace
        # style only — it cannot change behaviour, and the rules are in
        # .editorconfig so the fix is always the same command locally:
        #   dotnet format tools/Check.csproj
        run: dotnet format tools/Check.csproj --verify-no-changes --no-restore

  level-tests:
    # Runs the level-geometry test suite without Unity or a license.
    # These are pure-data tests (Vector3/Mathf are managed math), so
    # they execute under Mono against the reference assemblies in
    # tools/headless/refs. Fast pre-flight; the GameCI tag build still
    # runs the full suite including the scene-dependent tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run level-audit tests headlessly
        run: dotnet run --project tools/headless/HeadlessTests.csproj
